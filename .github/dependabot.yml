version: 2
updates:
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    groups:
      flutter-dependencies:
        patterns:
          - "*"
    ignore:
      - dependency-name: "google_sign_in"
        update-types:
          - "version-update:semver-major"
