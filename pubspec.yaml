name: clarity_software
description: Prototipo académico de seguimiento de proyectos, hitos y comunicación entre clientes y administradores.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # --- Dependencias Principales (FIREBASE ACTUALIZADO) ---
  # Actualizamos a las versiones que soportan compileSdk 36 y Pigeon
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  cloud_firestore: ^6.9.0
  firebase_storage: ^13.5.0
  
  # --- Autenticación ---
  google_sign_in: ^6.2.1
  
  # --- Utilidades ---
  intl: ^0.19.0
  provider: ^6.1.1
  path_provider: ^2.1.4
  path: ^1.9.0
  
  # --- UI y Multimedia ---
  image_picker: ^1.1.2
  
  # MANTENEMOS FILE PICKER MODERNO
  file_picker: ^8.1.4 
  
  # Plugin vital para evitar conflictos en Android 34/36
  flutter_plugin_android_lifecycle: ^2.0.24 

  font_awesome_flutter: ^10.7.0
  signature: ^5.4.1
  url_launcher: ^6.3.0
  
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logos/