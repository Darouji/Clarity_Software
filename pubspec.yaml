name: clarity_software
description: A new Flutter project.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # --- Dependencias Principales ---
  firebase_core: ^2.24.2
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.14.0
  firebase_storage: ^11.6.0
  
  # --- Autenticación ---
  google_sign_in: ^6.1.6
  
  # --- Utilidades ---
  intl: ^0.19.0
  provider: ^6.1.1
  path_provider: ^2.1.2
  path: ^1.9.0
  
  # --- UI y Multimedia ---
  image_picker: ^1.0.7
  # IMPORTANTE: Actualizado a 8.0.0+ para corregir error de compilación en Android
  file_picker: ^8.0.0 
  font_awesome_flutter: ^10.7.0
  signature: ^5.4.1
  url_launcher: ^6.2.4
  
  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logos/