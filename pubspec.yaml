name: clarity_software
description: "A SaaS Flutter project for client-business management."
publish_to: 'none'

version: 1.1.0+2

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # --- UI & Diseño ---
  font_awesome_flutter: ^10.8.0
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  intl: ^0.20.2

  # --- Firebase & Backend ---
  firebase_core: ^3.10.1
  firebase_auth: ^5.4.1
  cloud_firestore: ^5.6.2
  firebase_storage: ^12.4.1
  
  # --- Google Ecosystem ---
  google_sign_in: ^6.2.2
  googleapis: ^13.2.0
  googleapis_auth: ^1.6.0
  extension_google_sign_in_as_googleapis_auth: ^2.0.12

  # --- Utilidades ---
  shared_preferences: ^2.5.1
  file_picker: ^8.1.7
  open_file: ^3.5.0
  path_provider: ^2.1.5
  url_launcher: ^6.3.0
  path: ^1.9.0  # <--- AGREGADO: Soluciona el error en storage_service
  
  # --- Firma Digital ---
  signature: ^5.5.0

  # --- Gráficos ---
  fl_chart: ^0.70.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

# --- Configuración del Icono ---
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logos/logo_clarity.png"
  min_sdk_android: 21
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/logos/logo_clarity.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/logos/